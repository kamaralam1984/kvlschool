worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/json application/javascript application/xml+rss
                    application/atom+xml image/svg+xml font/woff2;

    # Security headers (applied globally)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

    # Shared proxy params (reused across all locations)
    proxy_http_version    1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       off;

    # ─── Upstream servers ─────────────────────────────────────
    upstream web     { server web:3000;     keepalive 16; }
    upstream admin   { server admin:3000;   keepalive 16; }
    upstream student { server student:3000; keepalive 16; }
    upstream parent  { server parent:3000;  keepalive 16; }
    upstream teacher { server teacher:3000; keepalive 16; }
    upstream api     { server api:4000;     keepalive 32; }

    # ─── HTTP → HTTPS redirect (uncomment in production) ──────
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ─── Public Website: kvlschool.edu.in ─────────────────────
    server {
        listen 80;
        server_name kvlschool.edu.in www.kvlschool.edu.in localhost;

        client_max_body_size 10M;

        # Static assets — long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            proxy_pass http://web;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://web;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── Admin Panel: admin.kvlschool.edu.in ──────────────────
    server {
        listen 80;
        server_name admin.kvlschool.edu.in;

        client_max_body_size 50M;

        # Restrict admin to specific IPs in production:
        # allow 203.0.113.0/24;
        # deny all;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            proxy_pass http://admin;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://admin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }

    # ─── Student Portal: student.kvlschool.edu.in ─────────────
    server {
        listen 80;
        server_name student.kvlschool.edu.in;

        client_max_body_size 20M;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            proxy_pass http://student;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://student;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }

    # ─── Parent Portal: parent.kvlschool.edu.in ───────────────
    server {
        listen 80;
        server_name parent.kvlschool.edu.in;

        client_max_body_size 10M;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            proxy_pass http://parent;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://parent;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }

    # ─── Teacher Portal: teacher.kvlschool.edu.in ─────────────
    server {
        listen 80;
        server_name teacher.kvlschool.edu.in;

        client_max_body_size 20M;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            proxy_pass http://teacher;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://teacher;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }

    # ─── API: api.kvlschool.edu.in ────────────────────────────
    server {
        listen 80;
        server_name api.kvlschool.edu.in;

        client_max_body_size 50M;

        # Health check (unrestricted)
        location = /health {
            proxy_pass http://api;
            access_log off;
        }

        # Auth endpoints — strict rate limit
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://api;
        }

        # File uploads — separate limit
        location ~* /upload {
            limit_req zone=upload burst=5 nodelay;
            proxy_pass http://api;
            proxy_read_timeout 120s;
            client_max_body_size 50M;
        }

        # All other API endpoints
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api;
        }

        # WebSocket — Socket.IO (no timeout)
        location /socket.io/ {
            proxy_pass http://api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Block unknown paths
        location / {
            return 404 '{"success":false,"message":"Route not found"}';
            add_header Content-Type application/json;
        }
    }
}
