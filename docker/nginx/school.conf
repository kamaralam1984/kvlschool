# KVL School — school.kvlbusinesssolutions.com
# Safe: does NOT affect vidyt.com, aapkaplot.com, 8rupiya.in, kvlbusinesssolutions.com

server {
    listen 80;
    server_name school.kvlbusinesssolutions.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name school.kvlbusinesssolutions.com;

    ssl_certificate     /etc/letsencrypt/live/school.kvlbusinesssolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.kvlbusinesssolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─── API ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── WebSocket ────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
    }

    # ─── Admin Panel (basePath: /admin) ───────────────────────────
    location /admin {
        proxy_pass         http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Student Portal (basePath: /student) ──────────────────────
    location /student {
        proxy_pass         http://127.0.0.1:3202;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Parent Portal (basePath: /parent) ────────────────────────
    location /parent {
        proxy_pass         http://127.0.0.1:3203;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Teacher Portal (basePath: /teacher) ──────────────────────
    location /teacher {
        proxy_pass         http://127.0.0.1:3204;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Public Website (root) ────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
