# ─── school.kvlbusinesssolutions.com ─────────────────────────
# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name school.kvlbusinesssolutions.com www.school.kvlbusinesssolutions.com;
    return 301 https://$host$request_uri;
}

# ─── Main HTTPS server ────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name school.kvlbusinesssolutions.com;

    ssl_certificate     /etc/letsencrypt/live/school.kvlbusinesssolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.kvlbusinesssolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50M;

    # ─── API (port 4000) ──────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ─── WebSocket (Socket.IO) ────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Admin Panel (port 3001) ──────────────────────────────
    location /admin/ {
        proxy_pass         http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Student Portal (port 3002) ───────────────────────────
    location /student/ {
        proxy_pass         http://localhost:3002/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Parent Portal (port 3003) ────────────────────────────
    location /parent/ {
        proxy_pass         http://localhost:3003/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Teacher Portal (port 3004) ───────────────────────────
    location /teacher/ {
        proxy_pass         http://localhost:3004/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Public Website (port 3000) — default ─────────────────
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
